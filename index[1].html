<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Internship Certificate</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#333}
.page{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:70px 16px}
.card{width:100%;max-width:540px;background:#fff;border:1px solid #ddd;border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,.16);padding:28px 24px 30px;text-align:center}
h1{margin:0 0 30px;font-size:30px;font-weight:400;text-decoration:underline}
.icon{font-size:62px;line-height:1;margin-bottom:25px}
p{font-size:20px;line-height:1.55;margin:12px 0}
.name,.program{font-weight:700}
.period{margin-top:18px}
.footer{margin-top:28px;font-size:12px;color:#777;line-height:1.45}
@media(max-width:420px){
 .page{padding:55px 12px}
 .card{padding:25px 18px 28px}
 h1{font-size:27px}
 p{font-size:18px}
}
</style>
</head>
<body>
<main class="page">
<section class="card">
<h1>Internship Certificate</h1>
<div class="icon" aria-hidden="true">🎓</div>
<p>This certificate is issued to <span class="name">Vani Agarwal</span></p>
<p>for successfully completing the <span class="program">AWS Internship</span>.</p>
<p class="period">Internship period: <strong>8 June 2026 to 8 August 2026</strong>.</p>
<div class="footer">Personal demonstration / verification page. This page is not an official Internship Studio verification page.</div>
</section>
</main>
</body>
</html>
